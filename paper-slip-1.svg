<svg xmlns="http://www.w3.org/2000/svg" width="421" height="265" viewBox="0 0 421 265" role="img" aria-labelledby="title description">
  <title id="title">Workshop paper slip - Instance 1</title>
  <desc id="description">Example paper slip with Instance 1 highlighted in yellow. Username and password are placeholders.</desc>
  <rect width="421" height="265" fill="white"/>
  <g fill="#ffeb3b" transform="translate(170 133) scale(1.12 1.4) translate(-170 -133)">
    <path d="M 120 125 L 131 123 L 151 124 L 174 122 L 194 123 L 217 121 L 220 125 L 219 132 L 221 140 L 207 142 L 188 141 L 167 143 L 146 142 L 128 144 L 119 142 L 121 134 Z" fill-opacity=".52"/>
    <path d="M 122 127 Q 146 124 170 125 T 218 124 L 219 139 Q 195 138 171 140 T 121 141 Z" fill-opacity=".35"/>
    <path d="M 119 129 Q 157 126 184 127 T 221 126 L 220 131 Q 176 129 120 133 Z" fill-opacity=".17"/>
  </g>
  <g font-family="Arial, sans-serif" fill="black">
    <g font-size="18" font-weight="700">
      <text x="14" y="52">Go to this URL</text>
      <text x="14" y="75" fill="black" text-decoration="underline">https://dave55408.github.io/Sketch/</text>
      <text x="42" y="98">1)   Download lab files</text>
      <text x="42" y="139">2) Select <tspan x="124">Instance 1</tspan></text>
    </g>
    <g font-size="14">
      <text x="14" y="184">Username</text>
      <text x="14" y="209">Password</text>
    </g>
    <g font-family="Courier New, monospace" font-size="18" font-weight="700">
      <text x="102" y="184">&lt;here&gt;</text>
      <text x="102" y="209">&lt;here&gt;</text>
    </g>
    <text x="14" y="231" font-size="13">Username and password are case sensitive.</text>
  </g>
</svg>
