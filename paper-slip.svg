<svg xmlns="http://www.w3.org/2000/svg" width="421" height="265" viewBox="0 0 421 265" role="img" aria-labelledby="title description">
  <title id="title">Workshop paper slip</title>
  <desc id="description">Example paper slip with Instance # circled in red. Username and password are placeholders.</desc>
  <rect width="421" height="265" fill="white"/>
  <defs>
    <filter id="circle-shadow" x="-15%" y="-35%" width="130%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="1" dy="1.8" stdDeviation="0.8" flood-color="#48221f" flood-opacity=".3"/>
    </filter>
  </defs>
  <g fill="none" stroke="#c92f28" stroke-linecap="round" stroke-linejoin="round" transform="translate(171 132) rotate(-2.5) scale(1.21) translate(-171 -132)" filter="url(#circle-shadow)">
    <path d="M 218 118 C 197 109 145 110 124 119 C 107 126 110 141 127 147 C 149 155 199 153 217 144 C 233 136 231 124 213 117" stroke-width="3.2"/>
    <path d="M 214 116 C 191 109 148 113 128 120" stroke-width="1.5" opacity=".65"/>
  </g>
  <g font-family="Arial, sans-serif" fill="black">
    <g font-size="18" font-weight="700">
      <text x="14" y="52">Go to this URL</text>
      <text x="14" y="75" fill="black" text-decoration="underline">https://dave55408.github.io/Sketch/</text>
      <text x="42" y="98">1)   Download lab files</text>
      <text x="42" y="139">2) Select <tspan x="124">Instance #</tspan></text>
    </g>
    <g font-size="14">
      <text x="14" y="184">Username</text>
      <text x="14" y="209">Password</text>
    </g>
    <g font-family="Courier New, monospace" font-size="18" font-weight="700">
      <text x="102" y="184">&lt;here&gt;</text>
      <text x="102" y="209">&lt;here&gt;</text>
    </g>
    <text x="14" y="231" font-size="13">Username and password are case sensitive.</text>
  </g>
</svg>
